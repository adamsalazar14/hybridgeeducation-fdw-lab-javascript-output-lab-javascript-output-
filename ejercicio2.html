<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Salidas JS</title>
</head>
<body>

    <h1>Demostración de salida en Javascript</h1>

    <button onclick="mostrarAlerta()">Mostrar mi nombre</button>

    <hr>

    <p id="mensaje-dinamico"></p>
    <button onclick="cambiarMensaje()">Cambiar texto del párrafo</button>

    <script>
        console.log("La página se ha cargado correctamente.");

        function mostrarAlerta() {
            alert("Hola, mi nombre es [Tu Nombre]");
        }

        function cambiarMensaje() {
            document.getElementById("mensaje-dinamico").innerHTML = "¡Texto actualizado con Javascript!";
        }
    </script>

</body>
</html>
