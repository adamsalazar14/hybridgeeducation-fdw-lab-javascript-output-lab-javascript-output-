<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - JS</title>
</head>
<body>

    <p id="parrafo-vacio"></p>
    <button onclick="actualizarTexto()">Actualizar Contenido</button>

    <script>
        function actualizarTexto() {
            document.getElementById("parrafo-vacio").innerHTML = "¡Texto actualizado con Javascript!";
        }
    </script>

</body>
</html>
